<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="description" content="Əlüstü: problemi yazın, yaxınlıqdakı reytinqli ustanı xəritədə tapın, zəng edin və sifariş verin." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Əlüstü — usta əlinin altında</title>
  </head>
  <body>
    <script>
      // Gecə rejimində ilk yüklənmədə ağ işartı olmasın
      try {
        var m = localStorage.getItem("mui-mode") || "system";
        if (m === "system") m = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-mui-color-scheme", m);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
